# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.85
zoom_end_ratio=0.85
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=5.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.55
default_master_count=1
tag_num=3
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=50
repeat_delay=250
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x303446ff
border_color=0x51576dff
drop_color=0xa6d18955
split_color=0xe78284ff
focus_color=0x8caaeeff
maximized_screen_color=0xa6d189ff
urgent_color=0xe78284ff
scratchpad_color=0x85c1dcff
global_color=0xca9ee6ff
overlay_color=0x81c8beff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:grid

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config
bind=SUPER,Return,spawn,wezterm
bind=SUPER,t,spawn,wezterm

# exit
bind=SUPER,m,spawn,loginctl terminate-user "$USER"
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Down,exchange_client,down
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0

# monitor switch
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# Window rules
window_rule=is_floating:1,is_global:1,is_overlay:1,title:Picture-in-Picture
window_rule=is_floating:1,is_global:1,is_overlay:1,title:Picture in picture
window_rule=is_floating:1,is_global:1,is_overlay:1,title:Hình trong hình

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# Autostart (shell, DBus, Fcitx5)
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE QT_QPA_PLATFORMTHEME MANGO_SHELL
exec_once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE QT_QPA_PLATFORMTHEME MANGO_SHELL
exec_once=sh -c 'systemctl --user start mango-session.target "mango-${MANGO_SHELL:-noctalia}.target"'
exec_once=fcitx5 -d

# App bindings
bind=SUPER,b,spawn,brave
bind=SUPER,e,spawn,wezterm start -- yazi
bind=SUPER+ALT,l,spawn,loginctl lock-session
# Noctalia launcher on Super+D; Look stays on Alt+Space for now.
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=ALT,space,spawn,lookapp --toggle

# Screenshots
# Screenshot current display region
bind=NONE,Print,spawn,flameshot gui
# Screenshot current display
bind=SUPER,Print,spawn,flameshot screen

# Volume, media & brightness (dispatch to noctalia on tty1, wayle on tty2)
bind=NONE,XF86AudioRaiseVolume,spawn,shell-msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,shell-msg volume-down
bind=NONE,XF86AudioMute,spawn,shell-msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,shell-msg mic-mute
bind=NONE,XF86AudioPlay,spawn,shell-msg media-toggle
bind=NONE,XF86AudioNext,spawn,shell-msg media-next
bind=NONE,XF86AudioPrev,spawn,shell-msg media-prev
bind=NONE,XF86MonBrightnessUp,spawn,shell-msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,shell-msg brightness-down

# HDR Configuration (10-bit HDR10 cho wl-only Vulkan)
hdr_depth=2
bind=SUPER+ALT,h,togglehdr,toggle,HDMI-A-1

# Window rules bổ sung
window_rule=is_fake_fullscreen:1,title:Genshin Impact

# Ép tần số quét màn hình (144Hz cho Laptop, 200Hz và HDR cho Màn rời)
monitor_rule=name:eDP-1,width:1920,height:1080,refresh:144,x:0,y:0
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:200,x:1920,y:0,hdr:0
